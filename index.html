<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#071b13">

    <title>Card Game Score Keeper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="background-overlay"></div>

    <main class="app-container">

        <!-- ================= HEADER ================= -->
        <header class="header">

            <div class="brand">

                <div class="logo-box">
                    <img src="assets/logo.jpeg"
                        alt="Card Game Logo">
                </div>

                <div>
                    <div class="small-title">
                        CARD GAME
                    </div>

                    <h1>
                        Score Keeper
                    </h1>

                    <p>
                        Track every round with ease
                    </p>
                </div>

            </div>


            <div class="round-card">

                <span>
                    CURRENT ROUND
                </span>

                <strong id="roundNumber">
                    1
                </strong>

            </div>

        </header>


        <!-- ================= MAIN SCORE AREA ================= -->

        <section class="game-board">

            <div class="board-header">

                <div>
                    <span class="section-label">
                        PLAYERS
                    </span>

                    <h2>
                        Game Scoreboard
                    </h2>
                </div>

                <div class="live-status">
                    <span class="status-dot"></span>
                    LIVE
                </div>

            </div>


            <!-- Players -->
            <div class="players-grid" id="playersContainer">

                <!-- Player cards generated by JavaScript -->

            </div>


            <!-- ================= TOTAL ================= -->

            <div class="total-section">

                <div class="total-content">

                    <span>
                        TOTAL GAME SCORE
                    </span>

                    <strong id="totalScore">
                        0
                    </strong>

                </div>

                <div class="total-info">
                    Add scores using expressions like
                    <b>1+2</b>,
                    <b>5-3</b> or
                    <b>10-4+2</b>
                </div>

            </div>

        </section>


        <!-- ================= MESSAGE ================= -->

        <div id="message"
            class="message"
            aria-live="polite">
        </div>


        <!-- ================= ACTIONS ================= -->

        <section class="bottom-actions">

            <button
                type="button"
                id="nextRoundBtn"
                class="action-btn next-round">

                <span>➜</span>
                Next Round

            </button>


            <button
                type="button"
                id="newGameBtn"
                class="action-btn new-game">

                <span>↻</span>
                New Game

            </button>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>

            <p>
                ♠ ♥ ♦ ♣
                &nbsp; Card Game Score Keeper
                &nbsp; ♠ ♥ ♦ ♣
            </p>

        </footer>

    </main>


    <!-- ================= CONFIRM MODAL ================= -->

    <div id="modal"
        class="modal hidden">

        <div class="modal-box">

            <div class="modal-icon">
                ⚠
            </div>

            <h3>
                Start New Game?
            </h3>

            <p>
                All current scores and history will be cleared.
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelModal">
                    Cancel
                </button>

                <button
                    type="button"
                    id="confirmNewGame"
                    class="confirm-btn">
                    New Game
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
